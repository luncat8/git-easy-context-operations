name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:

jobs:
  test:
    name: Type-check, test, package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run check-types

      # 282 tests against real throw-away git repositories, no editor needed.
      - name: Test
        run: npm test

      - name: Bundle
        run: npm run bundle

      - name: Package the extension
        run: npx vsce package --no-dependencies --allow-missing-repository

      - name: Keep the manifest free of proposed APIs
        run: |
          node scripts/apply-graph-menu.mjs status
          if node -e "process.exit(require('./package.json').enabledApiProposals ? 1 : 0)"; then
            echo "manifest is publishable"
          else
            echo "::error::package.json asks for proposed APIs - run 'npm run graph-menu:off'"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: git-easy-ops-vsix
          path: '*.vsix'

  integration:
    name: VS Code integration smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run compile
      - run: npm run compile-tests

      # Needs a display: VS Code is a GUI application.
      - name: Run inside VS Code
        run: xvfb-run -a npm run test:vscode
